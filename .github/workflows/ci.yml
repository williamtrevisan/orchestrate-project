name: ci

on:
  push:
  pull_request:

jobs:
  structural:
    name: structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version check diffs against the pull request's base; a shallow
          # clone has no base to diff against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The installer is Node, and its tests shell out to it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run the shipped script's selftest
        run: |
          if [ -f plugins/orchestrate-project/scripts/init.py ]; then
            python3 plugins/orchestrate-project/scripts/init.py selftest
          else
            echo "init.py not written yet (T12-T15); skipping"
          fi

      - name: Refuse a shipped change that reuses the published version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt
          MANIFEST=plugins/orchestrate-project/.claude-plugin/plugin.json
          # `-` means the manifest does not exist on the base: a new plugin,
          # which nothing has published yet.
          if git cat-file -e "$BASE:$MANIFEST" 2>/dev/null; then
            git show "$BASE:$MANIFEST" > /tmp/base-plugin.json
            BASE_MANIFEST=/tmp/base-plugin.json
          else
            BASE_MANIFEST=-
          fi
          python3 .github/scripts/check_version_bump.py /tmp/changed.txt "$BASE_MANIFEST"
