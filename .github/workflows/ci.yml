name: ci

on:
  push:
  pull_request:

jobs:
  structural:
    name: structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The installer is Node, and its tests shell out to it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run the shipped script's selftest
        run: |
          if [ -f plugins/orchestrate-project/scripts/init.py ]; then
            python3 plugins/orchestrate-project/scripts/init.py selftest
          else
            echo "init.py not written yet (T12-T15); skipping"
          fi
